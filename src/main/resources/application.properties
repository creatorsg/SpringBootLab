spring.application.name=MySpringBootLabProject

myprop.application-name=${spring.application.name}
myprop.username=springboot
myprop.port=${random.int(1,100)}

spring.profiles.active=test

# MariaDB 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/lab_db
spring.datasource.username=lab
spring.datasource.password=lab

# JPA 설정 (테이블 자동 생성 및 SQL 로그 출력)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect